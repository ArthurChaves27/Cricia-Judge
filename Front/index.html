<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prova de Lógica de Programação - MVP</title>
    <link rel="stylesheet"href="styles.css"> 
</head>
<body>
 
    <div class="editor-area">
        <h2>Seu Código</h2>
        
        <iframe 
            id="editor-iframe"
            frameBorder="0" 
            height="100%" 
            src="https://onecompiler.com/embed/cpp?codeChangeEvent=true" 
            width="100%"
            style="flex-grow: 1; border-radius: 8px; background-color: white;"
        ></iframe>

        <div class="action-area">
            <button class="submit-btn" id="btn-submeter">Submeter Prova</button>
        </div>
    </div>

    <div class="modal" id="feedback-modal">
        <div class="modal-content">
            <h1 id="feedback-titulo">Enviando...</h1>
            <p id="feedback-mensagem">Aguarde a correção do Juiz Automatizado.</p>
            <button onclick="fecharModal()" style="padding: 10px 20px; cursor: pointer; margin-top: 15px;">OK</button>
        </div>
    </div>

    <div class="problem-area">
        <h2>Exercício 1: A Soma de Dois Números</h2>
        <div class="problem-description">
            <p>Escreva um programa que leia dois números inteiros da entrada padrão e imprima a soma desses dois números.</p>
        </div>
        <div class="examples">
            <strong>Exemplo de Entrada:</strong><br>5<br>3<br><br>
            <strong>Exemplo de Saída Esperada:</strong><br>8
        </div>
    </div>

    <script src="scripts.js" defer></script>
</body>
</html>
